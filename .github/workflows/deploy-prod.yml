name: deploy-prod

# Builds the single ai-almanac-web image (FastAPI + bundled SPA), runs DB
# migrations, then rolls the prod backend to the new revision. Mirror of
# deploy-staging.yml; the only differences are the trigger branch, the target
# service/job names, and the Globus redirect origin.

# Only paths that actually ship in the ai-almanac-web image trigger a deploy;
# workflow_dispatch stays as the escape hatch for everything else (docs,
# terraform, CI config, etc.).
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "modal/**"
      - "web/**"
      - "Dockerfile"
      - "pyproject.toml"
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  REGION: us-central1
  AR_IMAGE: us-central1-docker.pkg.dev/ai-almanac/almanac/ai-almanac-web
  SERVICE: almanac-backend
  MIGRATE_JOB: almanac-migrate

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/251618530185/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: almanac-ci@ai-almanac.iam.gserviceaccount.com
          token_format: access_token

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Log in to Artifact Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: us-central1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          # web/.env must stay out of the build (it pins VITE_API_URL to
          # localhost); .dockerignore handles that. The SPA reads its API base
          # from runtime /config.js, so VITE_API_URL is intentionally unset.
          #
          # Hardcoded public constants. The Globus client is shared across
          # origins (local/staging/prod) and already has this redirect
          # registered. VITE_GLOBUS_REDIRECT_URL must EXACTLY match the redirect
          # registered on the client for this origin, or Globus fails the
          # token-exchange CORS check ("NetworkError when attempting to fetch
          # resource") in an endless login loop. It must equal the origin the
          # SPA is served from (the LB prod domain).
          build-args: |
            VITE_GLOBUS_CLIENT_ID=c0309fe2-a701-45fa-bf28-1e4fed6c5f1a
            VITE_GLOBUS_REDIRECT_URL=https://ai-almanac.org/callback
          tags: |
            ${{ env.AR_IMAGE }}:latest
            ${{ env.AR_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Migrate before routing traffic: new code may need new schema. The job's
      # image is pinned in Terraform with ignore_changes, so point it at this
      # build, then run it to completion.
      - name: Run database migrations
        run: |
          gcloud run jobs update "$MIGRATE_JOB" \
            --region "$REGION" \
            --image "$AR_IMAGE:${{ github.sha }}"
          gcloud run jobs execute "$MIGRATE_JOB" --region "$REGION" --wait

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3.0.1
        with:
          service: ${{ env.SERVICE }}
          region: us-central1
          image: ${{ env.AR_IMAGE }}:${{ github.sha }}

  # Post-deploy verification (SDLC Phase 3): readiness + smoke tests + error
  # log soak via scripts/post_deploy_check.sh (all cloud-specific commands
  # live in the script). Shorter soak than staging: changes have already
  # soaked there. On failure, Claude triages into the workflow summary.
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Authenticate to GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/251618530185/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: almanac-ci@ai-almanac.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Smoke test and log soak
        run: ./scripts/post_deploy_check.sh "$SERVICE" "$REGION" "https://ai-almanac.org" 120

      - name: AI triage on failure
        if: failure()
        uses: anthropics/claude-code-action@d75b94d5ad426cb8546e6628b6f5f19b84e5cce1 # v1.0.216
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            The PRODUCTION deploy of commit ${{ github.sha }} failed
            post-deploy verification. Captured error logs (if the check
            reached the log scan) are in post-deploy-errors.txt. Inspect
            them and the recently deployed changes (git log/diff) and
            produce a concise triage: most likely root cause, the specific
            commit/change implicated if identifiable, and a recommendation —
            rollback (see docs/sdlc/rollback.md) or fix-forward. Append your
            analysis in markdown to the file whose path is in the
            GITHUB_STEP_SUMMARY environment variable.
          claude_args: >-
            --max-turns 12
            --allowedTools "Read,Grep,Glob,Bash(git log:*),Bash(git diff:*),Bash(git show:*),Write"
