name: codeql

# SAST via CodeQL (free for public repos). Advanced setup: this workflow owns
# the config, so do NOT also enable "default setup" in repo settings.
on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [develop, main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  schedule:
    - cron: "17 6 * * 1" # weekly, catches newly added queries/CVE patterns

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Analyze only the languages a change touches; the weekly run covers all.
  # Each filter is named after the CodeQL language it selects.
  languages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # paths-filter lists a PR's files through the API
    outputs:
      matrix: ${{ github.event_name == 'schedule' && '["python","javascript-typescript","actions"]' || steps.changes.outputs.changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'push'

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        if: github.event_name != 'schedule'
        with:
          filters: |
            python:
              - "**/*.{py,pyi}"
            javascript-typescript:
              - "**/*.{js,cjs,mjs,ts,svelte,html}"
            actions:
              - ".github/workflows/**"
              - ".github/actions/**"

  analyze:
    needs: languages
    if: needs.languages.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.languages.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: "/language:${{ matrix.language }}"
