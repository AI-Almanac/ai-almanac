name: claude-review

# General AI code review on every PR to develop (SDLC Phase 2).
# Runs with a context window independent of claude-security-review.yml —
# two gates, two contexts. Report-only: not a required check until the
# signal is calibrated (then add the job's context to the develop ruleset).
#
# Auth: CLAUDE_CODE_OAUTH_TOKEN (subscription seat via `claude setup-token`).
# Comments post as github-actions[bot] via the job token (see github_token).
# Quota guardrails: drafts and docs-only diffs skipped, superseded runs
# cancelled, turn-capped, fork PRs skipped (no secrets on forks anyway).
# Bot-triggered synchronizes (@claude fixups, autofix commits) are skipped:
# the action rejects bot actors outright, and re-reviewing an agent's
# mechanical follow-up commits is noise.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    branches: [develop]
    paths-ignore:
      - "docs/**"
      - "**.md"

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  claude-review:
    if: >-
      !github.event.pull_request.draft &&
      github.event.sender.type != 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      MAX_TURNS: 50
      # Strip credentials the agent's shell does not need (PR content can
      # prompt-inject it); GH_TOKEN stays for gh.
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The checkout is a detached merge commit, so a bare `gh pr diff` can't
      # find the PR, and a large diff overflows one tool result. Writing it to
      # files lets the reviewer page through it instead of improvising
      # (rejected) shell workarounds that burn turns.
      - name: Write the PR diff for the reviewer
        run: |
          mkdir -p .pr-review
          git diff --stat=200 HEAD^1 HEAD > .pr-review/stat.txt
          git diff HEAD^1 HEAD > .pr-review/pr.diff

      # CLAUDE_CODE_SUBPROCESS_ENV_SCRUB requires bubblewrap, which the action
      # installs only when allowed_non_write_users is set. Ubuntu 24.04 blocks
      # the unprivileged user namespaces bubblewrap needs unless relaxed.
      - name: Install subprocess isolation dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - uses: anthropics/claude-code-action@1623c36729ac1cd5895198cded705a287de7db79 # v1.0.187
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The job token is scoped to the permissions above. Without it the
          # action needs id-token: write to fetch the Claude App token, whose
          # installation scopes exceed this read-only review job.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # use_sticky_comment is broken in prompt mode (action issue #1108);
          # the prompt instructs gh pr comment instead (one comment per run).
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} for
            ai-almanac. CLAUDE.md is already in your context; do not re-read it.

            How to work here (each rejected tool call still costs a turn):
            - The checkout is the PR merged into its base, so HEAD^1..HEAD is
              exactly the PR's change. .pr-review/stat.txt lists the changed
              files; .pr-review/pr.diff is the full diff. For a large diff,
              Grep pr.diff for "^diff --git" and Read it in slices with
              offset/limit rather than all at once.
            - Your tools are Read, Grep, Glob, and these commands only:
              gh pr view, git log, git diff, git show, git blame,
              and the gh pr comment below. Run one command per call: pipes,
              redirects, chained commands, cd, and anything else are rejected.
            - You cannot run tests, install packages, or execute project code.
              Reason from the source.
            - You have ${{ env.MAX_TURNS }} turns. Investigate the riskiest
              changes first and leave turns to post: a review that covers the
              important parts and posts beats a complete one that never does.

            Review the diff with the surrounding code for context.

            Focus on, in order of importance:
            1. Correctness of changed behavior and adequacy of test coverage.
            2. Project-specific contracts:
               - API route changes must regenerate web/src/lib/api-types.gen.ts
                 in the same PR.
               - Database migrations must be backward-compatible one version
                 (deploys migrate before routing traffic).
               - Model initialization weekdays use Python numbering (Mon=0).
               - Data-source ownership boundaries: user-registered rows are
                 private, admin rows shared; check authz on new queries.
               - Widening lint/format scope or changing linter config
                 surfaces pre-existing violations in newly covered paths;
                 flag anything that will fail CI on the widened scope.
            3. Error handling and edge cases in changed code paths.
            4. Meaningful design problems (not style — formatters and linters
               own style).

            Verify each candidate finding against the actual code before
            reporting it; do not speculate. Write ONE concise review comment:
            findings ordered by severity (critical/major/minor), each with
            file:line and a concrete suggestion. If the PR looks good, say so
            in two sentences. Do not request changes for nitpicks.

            Publish it as a new comment with exactly this command (do not
            edit existing comments; each review posts its own):
              gh pr comment ${{ github.event.pull_request.number }} --body "..."
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns ${{ env.MAX_TURNS }}
            --allowedTools "Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git blame:*),mcp__github_inline_comment__create_inline_comment"

      # show_full_output would publish the whole transcript on this public
      # repo; the rejected calls alone show where turns are being wasted.
      - name: Summarize rejected tool calls
        if: always()
        run: scripts/summarize-rejected-tool-calls.sh "$RUNNER_TEMP/claude-execution-output.json" >> "$GITHUB_STEP_SUMMARY"
