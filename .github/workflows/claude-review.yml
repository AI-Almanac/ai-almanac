name: claude-review

# General AI code review on every PR to develop (SDLC Phase 2).
# Runs with a context window independent of claude-security-review.yml —
# two gates, two contexts. Review rules live in REVIEW.md. Not a required
# check; Critical/Major findings gate merges instead, as inline comments that
# the develop ruleset's thread-resolution rule blocks on.
#
# Auth: CLAUDE_CODE_OAUTH_TOKEN (subscription seat via `claude setup-token`).
# Comments post as github-actions[bot] via the job token (see github_token).
# Quota guardrails: drafts and docs-only diffs skipped, superseded runs
# cancelled, turn-capped, fork PRs skipped (no secrets on forks anyway).
# Re-reviews cover only the commits since the last review's marker, and a
# push with nothing new since then is skipped.
# Bot-triggered synchronizes (@claude fixups, autofix commits) are skipped:
# the action rejects bot actors outright, and re-reviewing an agent's
# mechanical follow-up commits is noise.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    branches: [develop]
    paths-ignore:
      - "docs/**"
      - "**.md"

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  claude-review:
    if: >-
      !github.event.pull_request.draft &&
      github.event.sender.type != 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      MAX_TURNS: 50
      # Strip credentials the agent's shell does not need (PR content can
      # prompt-inject it); GH_TOKEN stays for gh.
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The checkout is a detached merge commit, so a bare `gh pr diff` can't
      # find the PR, and a large diff overflows one tool result. Writing the
      # diffs and the previous review to files lets the reviewer page through
      # them instead of improvising (rejected) shell workarounds that burn
      # turns. A push that adds nothing since the last review is skipped.
      - name: Prepare the reviewer's inputs
        id: inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/prepare-review-inputs.sh "${{ github.event.pull_request.number }}" reviewed

      # CLAUDE_CODE_SUBPROCESS_ENV_SCRUB requires bubblewrap, which the action
      # installs only when allowed_non_write_users is set. Ubuntu 24.04 blocks
      # the unprivileged user namespaces bubblewrap needs unless relaxed.
      - name: Install subprocess isolation dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - uses: anthropics/claude-code-action@1623c36729ac1cd5895198cded705a287de7db79 # v1.0.187
        if: steps.inputs.outputs.skip != 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The job token is scoped to the permissions above. Without it the
          # action needs id-token: write to fetch the Claude App token, whose
          # installation scopes exceed this read-only review job.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # use_sticky_comment is broken in prompt mode (action issue #1108);
          # the prompt instructs gh pr comment instead (one comment per run).
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} for
            ai-almanac. CLAUDE.md is already in your context; do not re-read it.
            Read REVIEW.md first: it says what to look for, what to skip, and
            how to report. Follow it; this prompt only covers how to work in CI.

            How to work here (each rejected tool call still costs a turn):
            - The checkout is the PR merged into its base, so HEAD^1..HEAD is
              exactly the PR's change. .pr-review/stat.txt lists the changed
              files; .pr-review/pr.diff is the full diff. For a large diff,
              Grep a diff for "^diff --git" and Read it in slices with
              offset/limit rather than all at once.
            - Your tools are Read, Grep, Glob, the inline comment tool, and
              these commands only: gh pr view, git log, git diff, git show,
              git blame, and the gh pr comment below. Run one command per
              call: pipes, redirects, chained commands, cd, and anything else
              are rejected.
            - You cannot run tests, install packages, or execute project code.
              Reason from the source.
            - You have ${{ env.MAX_TURNS }} turns. Investigate the riskiest
              changes first and leave turns to post: a review that covers the
              important parts and posts beats a complete one that never does.

            What to review: this is review round ${{ steps.inputs.outputs.round }};
            the last reviewed commit is ${{ steps.inputs.outputs.since || 'none' }}.
            - If .pr-review/previous-review.md exists, read it before the diff
              and apply REVIEW.md's re-review rules.
            - If there is a last reviewed commit, review .pr-review/new.diff:
              the PR's files as changed since that commit (new-stat.txt lists
              them). Use pr.diff and the surrounding code only for context.
            - Otherwise review the whole PR in pr.diff. A previous review with
              no last reviewed commit means the branch was rebased.

            How to post:
            1. Post each Critical or Major finding that is not Pre-existing as
               an inline comment with
               mcp__github_inline_comment__create_inline_comment: path, the
               line in the PR's version of the file (it must fall inside a
               hunk of pr.diff), a body with the severity and fix, and
               confirmed: true. If a line is outside the diff, keep that
               finding in the summary only.
            2. Then publish the summary as a new comment with exactly this
               command (do not edit existing comments; each review posts its
               own):
                 gh pr comment ${{ github.event.pull_request.number }} --body "..."
               End the body with this line, exactly, so the next review knows
               where to start:
                 <!-- reviewed: ${{ github.event.pull_request.head.sha }} -->
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns ${{ env.MAX_TURNS }}
            --allowedTools "Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git blame:*),mcp__github_inline_comment__create_inline_comment"

      # show_full_output would publish the whole transcript on this public
      # repo; the rejected calls alone show where turns are being wasted.
      - name: Summarize rejected tool calls
        if: always()
        run: scripts/summarize-rejected-tool-calls.sh "$RUNNER_TEMP/claude-execution-output.json" >> "$GITHUB_STEP_SUMMARY"
