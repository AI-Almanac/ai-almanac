name: ci

on:
  pull_request:
  push:
    branches:
      - sveltekit
      - hholb/python-first

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The ai-almanac wheel force-includes web/build, so the editable install
      # that `pixi install` performs needs the SPA bundle to exist first.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend bundle
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: prefix-dev/setup-pixi@v0.8.10
        with:
          # Install the environments the check/test tasks resolve to: dev (ruff,
          # pytest) and default (node-backed web tasks). pixi.lock is committed,
          # so the solve is reproducible and cacheable.
          environments: dev default
          cache: true

      - name: Lint and type-check (backend + frontend)
        run: pixi run check

      - name: Tests (backend + frontend)
        run: pixi run test
