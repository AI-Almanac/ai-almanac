name: ci

# pull_request stays unfiltered: check-and-test is a required status check on
# main, and a path-skipped required check leaves doc-only PRs blocked forever.
# Inside the job, .github/path-filters.yml picks the checks a change needs; a
# job whose checks all skip still reports success.
on:
  pull_request:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - "docs/**"
      - "**.md"
  # autofix.yml re-dispatches this workflow after pushing a formatting fixup
  # commit, because GITHUB_TOKEN pushes never create pull_request runs on the
  # new head SHA and check-and-test is a required status check. A dispatched
  # run has no diff to filter on, so it runs every check.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # paths-filter lists a PR's files through the API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: .github/path-filters.yml

      - name: Choose the checks this change needs
        id: scope
        env:
          PYTHON: ${{ github.event_name == 'workflow_dispatch' || steps.changes.outputs.python == 'true' }}
          WEB: ${{ github.event_name == 'workflow_dispatch' || steps.changes.outputs.web == 'true' }}
          API: ${{ github.event_name == 'workflow_dispatch' || steps.changes.outputs.api == 'true' }}
          ANY: ${{ github.event_name == 'workflow_dispatch' || steps.changes.outputs.changes != '[]' }}
        run: |
          printf 'python=%s\nweb=%s\napi=%s\nany=%s\n' "$PYTHON" "$WEB" "$API" "$ANY" |
            tee -a "$GITHUB_OUTPUT"

      # The ai-almanac wheel force-includes web/build, so the wheel install
      # that `pixi install` performs needs the SPA bundle to exist first.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.scope.outputs.any == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend bundle
        if: steps.scope.outputs.any == 'true'
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        if: steps.scope.outputs.any == 'true'
        with:
          # Install the environments the check/test tasks resolve to: dev (ruff,
          # pytest) and default (node-backed web tasks). pixi.lock is committed,
          # so the solve is reproducible and cacheable.
          environments: dev default
          cache: true

      - name: Lint and format-check backend
        if: steps.scope.outputs.python == 'true'
        run: pixi run check-python

      - name: Type-check and format-check frontend
        if: steps.scope.outputs.web == 'true'
        run: pixi run check-frontend

      # The TS API types are generated from the FastAPI OpenAPI schema; a stale
      # file means a backend contract change wasn't propagated to the frontend.
      - name: API types are current
        if: steps.scope.outputs.api == 'true'
        run: |
          pixi run generate-api-types
          git diff --exit-code web/src/lib/api-types.gen.ts

      - name: Backend tests
        if: steps.scope.outputs.python == 'true'
        run: pixi run test-python

      - name: Frontend tests
        if: steps.scope.outputs.web == 'true'
        run: pixi run test-web
