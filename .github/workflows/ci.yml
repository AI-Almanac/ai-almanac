name: ci

# pull_request stays unfiltered: check-and-test is a required status check on
# main, and a path-skipped required check leaves doc-only PRs blocked forever.
on:
  pull_request:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - "docs/**"
      - "**.md"
  # autofix.yml re-dispatches this workflow after pushing a formatting fixup
  # commit, because GITHUB_TOKEN pushes never create pull_request runs on the
  # new head SHA and check-and-test is a required status check.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The ai-almanac wheel force-includes web/build, so the editable install
      # that `pixi install` performs needs the SPA bundle to exist first.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend bundle
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: prefix-dev/setup-pixi@14c8aabd75893f83f4ab30c03e7cf853c8208961 # v0.8.10
        with:
          # Install the environments the check/test tasks resolve to: dev (ruff,
          # pytest) and default (node-backed web tasks). pixi.lock is committed,
          # so the solve is reproducible and cacheable.
          environments: dev default
          cache: true

      - name: Lint and type-check (backend + frontend)
        run: pixi run check

      # The TS API types are generated from the FastAPI OpenAPI schema; a stale
      # file means a backend contract change wasn't propagated to the frontend.
      - name: API types are current
        run: |
          pixi run generate-api-types
          git diff --exit-code web/src/lib/api-types.gen.ts

      - name: Tests (backend + frontend)
        run: pixi run test
