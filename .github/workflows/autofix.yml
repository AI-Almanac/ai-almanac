name: autofix

# Deterministic formatting backstop (SDLC Phase 2): when a PR head commit
# carries formatting or safe-fixable lint violations (hookless clones, agent
# pushes), fix them in CI and push a fixup commit instead of failing and
# waiting for a human to run the formatter. Because develop is gated on
# `pixi run check`, the tree is always clean at the merge-base, so running
# the formatters over the full CI scope can only ever touch files this PR
# changed — no unrelated churn.
#
# Recursion safety: the fixup is pushed with GITHUB_TOKEN, which never
# triggers pull_request runs, so this workflow cannot re-trigger itself.
# The flip side is that check-and-test (a required status check) would
# never run on the new head SHA either, so the job re-dispatches ci.yml
# explicitly after pushing.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

concurrency:
  group: autofix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  autofix:
    # Same-repo heads only: GITHUB_TOKEN cannot push to fork branches.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      pull-requests: read # paths-filter lists the PR's files through the API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # Only the formatters for what the PR touches: a Python-only PR never
      # needs the npm install.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: .github/path-filters.yml

      # Bare ruff: [tool.ruff] include in pyproject.toml sets the scope,
      # the same one `pixi run check` enforces.
      - name: Format Python and apply safe lint fixes
        if: steps.changes.outputs.python == 'true'
        run: |
          pip install --quiet ruff==0.15.16  # keep in sync with pixi.lock
          ruff format
          ruff check --fix-only

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.changes.outputs.web == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Format the frontend
        if: steps.changes.outputs.web == 'true'
        run: |
          npm ci --prefix web --no-audit --no-fund
          npm run format --prefix web

      - name: Push fixup commit if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet; then
            echo "Nothing to fix."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "style: apply automatic formatting and safe lint fixes"
          git push origin "HEAD:$HEAD_REF"
          gh workflow run ci.yml --ref "$HEAD_REF"
