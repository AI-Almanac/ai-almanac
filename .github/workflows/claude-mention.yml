name: claude-mention

# @claude responder (SDLC Phase 2): mention @claude in a PR/issue comment or
# review to ask follow-up questions or request fixes. Unlike the read-only
# review workflows, this one may push commits to the PR branch — the human
# merge gate on develop/main still owns authorization.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read

jobs:
  claude:
    if: >-
      contains(github.event.comment.body, '@claude') &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # Give Claude the same formatters CI enforces, so pushed fixes arrive
      # already formatted. A separate post-format commit would not retrigger
      # CI (GITHUB_TOKEN pushes are recursion-guarded), so formatting must
      # happen inside Claude's own commit.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install formatters
        run: |
          pip install --quiet ruff==0.15.16  # keep in sync with pixi.lock
          npm ci --prefix web --no-audit --no-fund

      - uses: anthropics/claude-code-action@c3d45e8e941e1b2ad7b278c57482d9c5bf1f35b3 # v1.0.99
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --max-turns 25
            --append-system-prompt "Before committing any code changes: run 'ruff format' and 'ruff check' on changed Python files (fix findings), and 'web/node_modules/.bin/prettier --write' on changed files under web/. Both tools are preinstalled. CI enforces these gates, so unformatted commits fail. pixi is NOT installed here; use the tools directly."
