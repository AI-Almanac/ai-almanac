name: claude-mention

# @claude responder (SDLC Phase 2): mention @claude in a PR/issue comment or
# review to ask follow-up questions or request fixes. Unlike the read-only
# review workflows, this one may push commits to the PR branch — the human
# merge gate on develop/main still owns authorization.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read

jobs:
  claude:
    if: >-
      contains(github.event.comment.body, '@claude') &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Give Claude ruff so Python fixes arrive already formatted and lint-clean
      # (the common case), keeping the agent's own commit green on CI's Python
      # gates. Web formatting is deliberately NOT run here: prettier executes
      # repo-controlled JS config/plugins, so granting it to an agent that
      # reads untrusted PR content (including fork heads it checks out) is a
      # code-execution path. autofix.yml formats web files deterministically
      # on the resulting synchronize instead — agent pushes trigger it.
      - name: Install ruff
        run: pip install --quiet ruff==0.15.16  # keep in sync with pixi.lock

      - uses: anthropics/claude-code-action@d75b94d5ad426cb8546e6628b6f5f19b84e5cce1 # v1.0.216
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # --allowedTools must grant the commands the system prompt asks for:
          # the action's base allowlist only permits git. ruff reads declarative
          # TOML and executes nothing; prettier is intentionally omitted (see above).
          claude_args: >-
            --max-turns 25
            --allowedTools "Bash(ruff format:*),Bash(ruff check:*)"
            --append-system-prompt "Before committing any Python changes: run 'ruff format' and 'ruff check' on changed files under src/, tests/, modal/, or scripts/ and fix findings. ruff is preinstalled; pixi is NOT installed here, so call ruff directly. Do NOT run prettier or format web/ files — the autofix CI workflow formats those after you push. If you widen ruff's lint or format scope or change its config, run ruff over the newly covered paths and include the fixes in the same commit."
