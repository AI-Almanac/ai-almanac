name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          enable-cache: true

      - name: Build SvelteKit SPA
        run: |
          cd web
          npm ci
          npm run build

      - name: Build Python wheel + sdist
        run: |
          uv build
          ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write   # OIDC trust for PyPI Trusted Publishers
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  # The Homebrew tap and .deb package live in adjacent repos:
  #   github.com/AI-Almanac/homebrew-ai-almanac   — formula
  #   github.com/AI-Almanac/ai-almanac-apt        — fpm-built .deb + apt repo
  # Each repo's own release.yml watches for the version bump and re-publishes
  # its artifact. They're not built here so this workflow stays focused on the
  # PyPI source of truth.
