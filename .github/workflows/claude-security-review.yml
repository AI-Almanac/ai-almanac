name: claude-security-review

# Security-focused AI review, deliberately separate from claude-review.yml so
# the two reviewers have independent context windows (SDLC Phase 2). Runs only
# on PRs touching security-relevant paths to conserve seat quota.
# Bot-triggered synchronizes (@claude fixups, autofix commits) are skipped:
# the action rejects bot actors outright, and re-reviewing an agent's
# mechanical follow-up commits is noise.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    branches: [develop, main]
    paths:
      - "src/ai_almanac/server/**"
      - "terraform/**"
      - ".github/**"
      - ".githooks/**"
      - "modal/**"
      - "deploy/**"
      - "Dockerfile"
      - "compose*.yaml"
      - "scripts/**"

concurrency:
  group: claude-security-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  claude-security-review:
    if: >-
      !github.event.pull_request.draft &&
      github.event.sender.type != 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@d75b94d5ad426cb8546e6628b6f5f19b84e5cce1 # v1.0.216
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # use_sticky_comment is broken in prompt mode (action issue #1108);
          # the prompt instructs gh pr comment instead (one comment per run).
          prompt: |
            You are a security reviewer for ai-almanac (FastAPI + SQLite +
            SvelteKit on Cloud Run; Modal jobs; OpenTofu infra). Review ONLY
            security implications of this PR's diff (gh pr diff), tracing each
            candidate issue through the actual code before reporting it.

            Threat classes to check, in priority order:
            1. Injection: SQL construction into SQLite, shell/subprocess calls,
               unsafe deserialization.
            2. AuthN/AuthZ: data-source ownership checks (user rows private,
               admin rows shared), Globus auth flows, any endpoint missing
               authorization on user-scoped resources.
            3. Path and URL validation: local-directory and gs:// data-source
               pointers (traversal, SSRF), file upload/download handling.
            4. Secrets: anything logged, echoed, committed, or baked into
               images; Secret Manager values leaving the boundary.
            5. GitHub Actions: untrusted event data (github.event.* values
               like PR titles, branch names, comment bodies) interpolated
               into run: blocks — workflow injection; overly broad
               permissions; unpinned actions.
            6. Terraform/IAM: privilege widening, public exposure of buckets
               or services.

            False positives erode trust in this gate: report only findings you
            verified in the code, each with severity (critical/high/medium/low),
            file:line, the attack path, and a concrete fix. Write ONE comment.
            If nothing is exploitable, say so in two sentences — do not pad.

            Publish it as a new comment with exactly this command (do not
            edit existing comments; each review posts its own):
              gh pr comment ${{ github.event.pull_request.number }} --body "..."

            Begin the comment body with the line "## Security review" so it
            is distinguishable from the general code review.
          claude_args: >-
            --max-turns 25
            --allowedTools "Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(git log:*),Bash(git diff:*),mcp__github_inline_comment__create_inline_comment"
