name: claude-security-review

# Security-focused AI review, deliberately separate from claude-review.yml so
# the two reviewers have independent context windows (SDLC Phase 2). Runs only
# on PRs touching security-relevant paths to conserve seat quota. Release PRs
# (develop -> main) are skipped: every change in them was already reviewed on
# its way into develop, and re-reviewing the whole batch exhausts the turn cap.
# Hotfix PRs straight to main are still reviewed. Review rules live in
# REVIEW.md; re-reviews cover only new commits that touch these paths.
# Bot-triggered synchronizes (@claude fixups, autofix commits) are skipped:
# the action rejects bot actors outright, and re-reviewing an agent's
# mechanical follow-up commits is noise.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    branches: [develop, main]
    paths:
      - "src/ai_almanac/server/**"
      - "terraform/**"
      - ".github/**"
      - ".githooks/**"
      - "modal/**"
      - "deploy/**"
      - "Dockerfile"
      - "compose*.yaml"
      - "scripts/**"

concurrency:
  group: claude-security-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  claude-security-review:
    if: >-
      !github.event.pull_request.draft &&
      github.event.sender.type != 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !(github.event.pull_request.head.ref == 'develop' &&
        github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-latest
    env:
      MAX_TURNS: 40
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The checkout is a detached merge commit, so a bare `gh pr diff` can't
      # find the PR, and a large diff overflows one tool result. Writing the
      # diffs and the previous review to files lets the reviewer page through
      # them instead of improvising (rejected) shell workarounds that burn
      # turns. A push whose new commits touch none of these paths is skipped;
      # keep the list in step with on.paths above.
      - name: Prepare the reviewer's inputs
        id: inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          scripts/prepare-review-inputs.sh "${{ github.event.pull_request.number }}" security-reviewed
          src/ai_almanac/server terraform .github .githooks modal deploy
          Dockerfile 'compose*.yaml' scripts

      - uses: anthropics/claude-code-action@db77d4d3c98f3f6380e7cd45ffba2342a3dbde3c # v1.0.254
        if: steps.inputs.outputs.skip != 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # use_sticky_comment is broken in prompt mode (action issue #1108);
          # the prompt instructs gh pr comment instead (one comment per run).
          prompt: |
            You are a security reviewer for ai-almanac (FastAPI + SQLite +
            SvelteKit on Cloud Run; Modal jobs; OpenTofu infra). Review ONLY
            security implications of pull request
            #${{ github.event.pull_request.number }}. Read REVIEW.md first:
            your scope is its "Security review" section, and its Skip,
            Evidence, Severity, Reporting, and Re-reviews sections apply.
            This prompt only covers how to work in CI.

            How to work here (each rejected tool call still costs a turn):
            - The checkout is the PR merged into its base, so HEAD^1..HEAD is
              exactly the PR's change. .pr-review/stat.txt lists the changed
              files; .pr-review/pr.diff is the full diff. For a large diff,
              Grep a diff for "^diff --git" and Read it in slices with
              offset/limit rather than all at once.
            - Your tools are Read, Grep, Glob, the inline comment tool, and
              these commands only: gh pr view, git log, git diff, git show,
              git blame, and the gh pr comment below. Run one command per
              call: pipes, redirects, chained commands, cd, and anything else
              are rejected.
            - You cannot run tests, install packages, or execute project code.
              Reason from the source.
            - You have ${{ env.MAX_TURNS }} turns. Investigate the riskiest
              changes first and leave turns to post: a review that covers the
              important parts and posts beats a complete one that never does.

            What to review: this is security review round
            ${{ steps.inputs.outputs.round }}; the last reviewed commit is
            ${{ steps.inputs.outputs.since || 'none' }}.
            - If .pr-review/previous-review.md exists, read it before the diff
              and apply REVIEW.md's re-review rules.
            - If there is a last reviewed commit, review .pr-review/new.diff:
              the PR's security-relevant files as changed since that commit
              (new-stat.txt lists them). Use pr.diff and the surrounding code
              only for context.
            - Otherwise review the whole PR in pr.diff. A previous review with
              no last reviewed commit means the branch was rebased.

            How to post:
            1. Post each Critical or Major finding that is not Pre-existing as
               an inline comment with
               mcp__github_inline_comment__create_inline_comment: path, the
               line in the PR's version of the file (it must fall inside a
               hunk of pr.diff), a body with the severity, attack path, and
               fix, and confirmed: true. If a line is outside the diff, keep
               that finding in the summary only.
            2. Then publish the summary as a new comment with exactly this
               command (do not edit existing comments; each review posts its
               own):
                 gh pr comment ${{ github.event.pull_request.number }} --body "..."
               Begin the body with the line "## Security review" so it is
               distinguishable from the general code review, and end it with
               this line, exactly, so the next review knows where to start:
                 <!-- security-reviewed: ${{ github.event.pull_request.head.sha }} -->
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns ${{ env.MAX_TURNS }}
            --allowedTools "Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git blame:*),mcp__github_inline_comment__create_inline_comment"

      # show_full_output would publish the whole transcript on this public
      # repo; the rejected calls alone show where turns are being wasted.
      - name: Summarize rejected tool calls
        if: always()
        run: scripts/summarize-rejected-tool-calls.sh "$RUNNER_TEMP/claude-execution-output.json" >> "$GITHUB_STEP_SUMMARY"
