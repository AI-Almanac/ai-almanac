name: claude-security-review

# Security-focused AI review, deliberately separate from claude-review.yml so
# the two reviewers have independent context windows (SDLC Phase 2). Runs only
# on PRs touching security-relevant paths to conserve seat quota. Release PRs
# (develop -> main) are skipped: every change in them was already reviewed on
# its way into develop, and re-reviewing the whole batch exhausts the turn cap.
# Hotfix PRs straight to main are still reviewed.
# Bot-triggered synchronizes (@claude fixups, autofix commits) are skipped:
# the action rejects bot actors outright, and re-reviewing an agent's
# mechanical follow-up commits is noise.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    branches: [develop, main]
    paths:
      - "src/ai_almanac/server/**"
      - "terraform/**"
      - ".github/**"
      - ".githooks/**"
      - "modal/**"
      - "deploy/**"
      - "Dockerfile"
      - "compose*.yaml"
      - "scripts/**"

concurrency:
  group: claude-security-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  claude-security-review:
    if: >-
      !github.event.pull_request.draft &&
      github.event.sender.type != 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !(github.event.pull_request.head.ref == 'develop' &&
        github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-latest
    env:
      MAX_TURNS: 40
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The checkout is a detached merge commit, so a bare `gh pr diff` can't
      # find the PR, and a large diff overflows one tool result. Writing it to
      # files lets the reviewer page through it instead of improvising
      # (rejected) shell workarounds that burn turns.
      - name: Write the PR diff for the reviewer
        run: |
          mkdir -p .pr-review
          git diff --stat=200 HEAD^1 HEAD > .pr-review/stat.txt
          git diff HEAD^1 HEAD > .pr-review/pr.diff

      - uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # use_sticky_comment is broken in prompt mode (action issue #1108);
          # the prompt instructs gh pr comment instead (one comment per run).
          prompt: |
            You are a security reviewer for ai-almanac (FastAPI + SQLite +
            SvelteKit on Cloud Run; Modal jobs; OpenTofu infra). Review ONLY
            security implications of pull request
            #${{ github.event.pull_request.number }}, tracing each candidate
            issue through the actual code before reporting it.

            How to work here (each rejected tool call still costs a turn):
            - The checkout is the PR merged into its base, so HEAD^1..HEAD is
              exactly the PR's change. .pr-review/stat.txt lists the changed
              files; .pr-review/pr.diff is the full diff. For a large diff,
              Grep pr.diff for "^diff --git" and Read it in slices with
              offset/limit rather than all at once.
            - Your tools are Read, Grep, Glob, and these commands only:
              gh pr view, git log, git diff, git show, git blame,
              and the gh pr comment below. Run one command per call: pipes,
              redirects, chained commands, cd, and anything else are rejected.
            - You cannot run tests, install packages, or execute project code.
              Reason from the source.
            - You have ${{ env.MAX_TURNS }} turns. Investigate the riskiest
              changes first and leave turns to post: a review that covers the
              important parts and posts beats a complete one that never does.

            Threat classes to check, in priority order:
            1. Injection: SQL construction into SQLite, shell/subprocess calls,
               unsafe deserialization.
            2. AuthN/AuthZ: data-source ownership checks (user rows private,
               admin rows shared), Globus auth flows, any endpoint missing
               authorization on user-scoped resources.
            3. Path and URL validation: local-directory and gs:// data-source
               pointers (traversal, SSRF), file upload/download handling.
            4. Secrets: anything logged, echoed, committed, or baked into
               images; Secret Manager values leaving the boundary.
            5. GitHub Actions: untrusted event data (github.event.* values
               like PR titles, branch names, comment bodies) interpolated
               into run: blocks — workflow injection; overly broad
               permissions; unpinned actions.
            6. Terraform/IAM: privilege widening, public exposure of buckets
               or services.

            False positives erode trust in this gate: report only findings you
            verified in the code, each with severity (critical/high/medium/low),
            file:line, the attack path, and a concrete fix. Write ONE comment.
            If nothing is exploitable, say so in two sentences — do not pad.

            Publish it as a new comment with exactly this command (do not
            edit existing comments; each review posts its own):
              gh pr comment ${{ github.event.pull_request.number }} --body "..."

            Begin the comment body with the line "## Security review" so it
            is distinguishable from the general code review.
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns ${{ env.MAX_TURNS }}
            --allowedTools "Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git blame:*),mcp__github_inline_comment__create_inline_comment"

      # show_full_output would publish the whole transcript on this public
      # repo; the rejected calls alone show where turns are being wasted.
      - name: Summarize rejected tool calls
        if: always()
        run: scripts/summarize-rejected-tool-calls.sh "$RUNNER_TEMP/claude-execution-output.json" >> "$GITHUB_STEP_SUMMARY"
