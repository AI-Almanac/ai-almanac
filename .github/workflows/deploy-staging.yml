name: deploy-staging

# Builds the single ai-almanac-web image (FastAPI + bundled SPA), runs DB
# migrations, then rolls the staging backend to the new revision. Production
# runs the same single-image architecture; deploy-prod.yml is the mirror of
# this workflow targeting almanac-backend.

# Docs and terraform don't ship in the image, so they don't trigger a deploy;
# terraform is applied manually. workflow_dispatch stays as the escape hatch.
on:
  push:
    branches: [develop]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "terraform/**"
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  REGION: us-central1
  AR_IMAGE: us-central1-docker.pkg.dev/ai-almanac/almanac/ai-almanac-web
  SERVICE: almanac-backend-staging
  MIGRATE_JOB: almanac-migrate-staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: projects/251618530185/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: almanac-ci@ai-almanac.iam.gserviceaccount.com
          token_format: access_token

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Log in to Artifact Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: us-central1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          # web/.env must stay out of the build (it pins VITE_API_URL to
          # localhost); .dockerignore handles that. The SPA reads its API base
          # from runtime /config.js, so VITE_API_URL is intentionally unset.
          #
          # These are hardcoded (not repo `vars`) on purpose: they're public,
          # staging-specific constants, and the redirect URL must EXACTLY match
          # the Globus client's registered redirect for this origin. A stale
          # repo var here bakes a wrong redirect, and Globus then fails the
          # token-exchange CORS check ("NetworkError when attempting to fetch
          # resource") in an endless login loop. The redirect must equal the
          # origin the SPA is served from (the staging LB domain).
          build-args: |
            VITE_GLOBUS_CLIENT_ID=c0309fe2-a701-45fa-bf28-1e4fed6c5f1a
            VITE_GLOBUS_REDIRECT_URL=https://staging.ai-almanac.org/callback
          tags: |
            ${{ env.AR_IMAGE }}:latest
            ${{ env.AR_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Migrate before routing traffic: new code may need new schema. The job's
      # image is pinned in Terraform with ignore_changes, so point it at this
      # build, then run it to completion.
      - name: Run database migrations
        run: |
          gcloud run jobs update "$MIGRATE_JOB" \
            --region "$REGION" \
            --image "$AR_IMAGE:${{ github.sha }}"
          gcloud run jobs execute "$MIGRATE_JOB" --region "$REGION" --wait

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@251330ba9a8a34bfbc1622895f42e1d53fd14522 # v2
        with:
          service: ${{ env.SERVICE }}
          region: us-central1
          image: ${{ env.AR_IMAGE }}:${{ github.sha }}
