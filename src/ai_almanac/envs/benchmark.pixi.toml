# Pixi spec for the ai-almanac benchmark environment.
#
# This env holds ROMP and its NetCDF/geo stack. It is separate from
# ai-almanac's web runtime so scientific dependencies cannot break FastAPI.
#
# Installed into `$AI_ALMANAC_DATA_DIR/benchmark-env/` on first use via
# `ai-almanac env prepare`.

[workspace]
name = "ai-almanac-benchmark"
description = "Benchmark execution environment for ai-almanac."
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]

[dependencies]
python = "3.11.*"
pip = "*"
# Geo stack — conda-forge handles the C libs cleanly.
netcdf4 = "*"
h5netcdf = "*"
xarray = "*"
zarr = "*"
dask = "*"
fsspec = "2025.3.2.*"
cartopy = "*"
geopandas = "*"
matplotlib = "*"
numpy = "1.26.*"
pandas = "*"
pyproj = "*"
regionmask = "0.12.*"
seaborn = "*"
scipy = "*"

[pypi-dependencies]
# Tracks the branch that finds ensemble onsets block by block (AI-Almanac/ROMP
# 8b8a28c): identical results to af44762, a fraction of its memory, about 5x
# faster. An env locks the branch head it first solves against; to take later
# commits, delete its pixi.lock and re-run `env prepare`. Pin `rev` once merged.
momp = { git = "https://github.com/AI-Almanac/ROMP.git", branch = "memory-efficient-ensemble-onset" }
