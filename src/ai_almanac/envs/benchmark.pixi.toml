# Pixi spec for the ai-almanac benchmark environment.
#
# This env holds the heavy ML/geo stack (torch+CUDA, earth2studio, ROMP,
# NetCDF/HDF5 libs). It is separate from ai-almanac's own runtime env so a
# torch upgrade can't break the web server.
#
# Installed into `$AI_ALMANAC_DATA_DIR/benchmark-env/` on first use via
# `ai-almanac env prepare`.

[project]
name = "ai-almanac-benchmark"
description = "Benchmark execution environment for ai-almanac."
channels = ["conda-forge", "nvidia"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]

[dependencies]
python = "3.11.*"
pip = "*"
# Geo stack — conda-forge handles the C libs cleanly.
netcdf4 = "*"
h5netcdf = "*"
xarray = "*"
zarr = "*"
dask = "*"
numpy = "*"
scipy = "*"

[target.linux-64.dependencies]
pytorch = { version = ">=2.4", channel = "conda-forge" }
pytorch-cuda = { version = "12.4.*", channel = "nvidia" }

[target.linux-aarch64.dependencies]
# NVIDIA Spark / Jetson-class. CUDA torch wheels via pip below if conda-forge
# lacks coverage at install time.
pytorch = { version = ">=2.4", channel = "conda-forge" }

[target.osx-arm64.dependencies]
# Apple Silicon — CPU-only fallback for development. earth2studio inference
# is still possible (slower) for prototyping.
pytorch = { version = ">=2.4", channel = "conda-forge" }

[pypi-dependencies]
earth2studio = { version = "*", extras = ["data"] }
cdsapi = "*"
gcsfs = "*"
# ROMP — adjust to the published distribution name once available.
# romp = { git = "https://github.com/<org>/ROMP.git" }
