[workspace]
name = "ai-almanac-blending"
description = "Model blending execution environment for ai-almanac."
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]

[dependencies]
python = "3.11.*"
numpy = ">=2.4.6,<3"
pandas = ">=3.0.3,<4"
scipy = ">=1.17.1,<2"
scikit-learn = ">=1.9.0,<2"
statsmodels = ">=0.14.6,<0.15"
netcdf4 = ">=1.7.4,<2"
xarray = ">=2026.4.0,<2027"
pyyaml = ">=6.0.3,<7"
matplotlib = ">=3.11.0,<4"
seaborn = ">=0.13.2,<0.14"
pyproj = ">=3.7.2,<4"
shapely = ">=2.1.2,<3"
geopandas = ">=1.1.3,<2"
tqdm = ">=4.68.3,<5"
# forecast_entrypoint's score phase runs here and imports ai_almanac.paths.
platformdirs = ">=4"
cartopy = ">=0.25.0,<0.26"
kdepy = ">=1.1.12,<2"

[pypi-dependencies]
# Trains local blends and applies them to live forecasts (envs/blend_entrypoint.py),
# day-level forest included (onset_blending.evaluation.random_forest): local blends
# no longer need onset-forest. 1dcb4ed lets a live ensemble hold fewer members
# than the blend trained on (forecast_entrypoint asks for it when a job sets them).
onset-blending = { git = "https://github.com/AI-Almanac/onset_blending.git", rev = "1dcb4ed656155abb2bbb4b53d606f62e3e1624f7" }
