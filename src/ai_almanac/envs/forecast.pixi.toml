# Pixi spec for the ai-almanac live-forecast execution environment.
#
# Holds earth2studio and its PyTorch/CUDA stack, plus the netCDF/zarr stack the
# season rollouts write and read. Separate from the benchmark/blending
# environments since this is by far the heaviest of the three — kept out of the
# default install so `pip install ai-almanac` and `ai-almanac env prepare`'s
# other environments stay light.
#
# Multiple environments, one manifest: the AIFS model families pin mutually
# incompatible `anemoi-models` versions (v1 needs 0.5.1, AIFS2 needs 0.9.x,
# AIFS2-ENS needs 0.11.2), so they cannot share one solve. Each `[environments]`
# entry below is solved independently by pixi. A forecast model's `env` field in
# forecast_models.yaml names which one runs it; the env manager selects it with
# `pixi run -e <env>`.
#
# Installed into `$AI_ALMANAC_DATA_DIR/forecast-env/` on first use via
# `ai-almanac env prepare`. Real (non-stub) local execution requires a GPU —
# see the `self-host-local-gpu` deployment profile.

[workspace]
name = "ai-almanac-forecast"
description = "Live forecast execution environment for ai-almanac."
channels = ["conda-forge"]
# Linux only: earth2studio's GPU extras (e.g. fuxi's onnxruntime-gpu) ship no
# macOS wheels at all, and forecast_pipeline.load_model() hard-requires CUDA
# regardless — there's no CPU/Mac fallback to support. Real local execution
# needs a Linux GPU host (see the `self-host-local-gpu` deployment profile).
platforms = ["linux-64", "linux-aarch64"]

# onnxruntime-gpu (fuxi extra) ships its only aarch64 wheel as
# manylinux_2_34; without this floor pixi assumes an older glibc and the
# pypi solve finds no compatible wheel. Requires hosts with glibc >= 2.34
# (Ubuntu 22.04+).
[system-requirements]
libc = { family = "glibc", version = "2.34" }
# Without an explicit cuda requirement pixi hides the __cuda virtual
# package from the solver and conda-forge resolves CPU-only pytorch.
# Requires a CUDA 13 driver on forecast hosts; keeps the solved pytorch,
# cuda-nvcc, and flash-attn build all on the same CUDA major.
cuda = "13"

# Shared conda base — the PyTorch/CUDA + netCDF stack every environment needs. Only
# the earth2studio extras (with their conflicting anemoi pins) differ per group.
[dependencies]
# 3.12: earth2studio's graphcast/gencast extras need weathernext, which it
# only declares for Python 3.12 and later (on 3.11 those models install
# without their package).
python = "3.12.*"
pip = "*"
pytorch = "*"
# Prebuilt from conda-forge so the pypi solve never compiles the flash-attn
# sdist (a 30+ minute CUDA build needing an in-env toolchain). Satisfies the
# `flash-attn` requirement of every earth2studio AIFS extra — pixi maps the
# conda package onto the pypi requirement — and is ABI-matched to conda-forge
# pytorch, unlike upstream's release wheels (pypi-torch-only, no aarch64).
flash-attn = "*"
netcdf4 = "<1.7.3"
# python-dateutil 3 breaks the pypi solve: earth2studio needs s3fs, s3fs needs
# aiobotocore, and every aiobotocore caps python-dateutil<3.
python-dateutil = "<3"
h5netcdf = "*"
# weathernext (earth2studio's gencast/graphcast extras) caps xarray<=2026.2.0;
# an uncapped conda solve picks a newer xarray and makes the pypi solve
# unsatisfiable.
xarray = "<=2026.2.0"
zarr = "*"
numpy = "*"
pyyaml = "*"
# forecast_entrypoint imports ai_almanac (paths/settings/forecast_pipeline)
# via PYTHONPATH; these are that import chain's only non-stdlib deps.
platformdirs = "*"
pydantic-settings = "*"

# earth2studio 0.19.0, pinned to its release commit. Keep the rev in step with
# modal/forecasts_app.py's inference images.

# base: everything whose deps coexist — the non-AIFS models (Aurora 1.5 among
# them, from the `aurora` extra) plus AIFS v1 (anemoi-models 0.5.1, as proven in
# the 0.14.0 single-env build).
[feature.base.pypi-dependencies]
earth2studio = { git = "https://github.com/NVIDIA/earth2studio.git", rev = "1a6e3669db0b04c1b42253cf0e631ed1ee8817ea", extras = ["aifs", "aifsens", "aurora", "data", "fuxi", "gencast", "graphcast"] }

# onnxruntime-gpu (fuxi extra) pin, linux-aarch64 only. earth2studio's uv
# source maps onnxruntime-gpu to the ort-cuda-13-nightly feed, whose current
# builds (1.25.0.dev–1.28.0.dev and the 1.26.0 release) ship no GB10 (sm_121)
# SASS — only sm_120a, which is arch-exact and won't run on sm_121 — plus PTX
# compiled by CUDA 13.1 (ISA 9.1), which a CUDA 13.0 driver's JIT rejects with
# cudaErrorUnsupportedPtxVersion (seen on DGX Spark, driver 580.x). The 1.29.0
# release on the onnxruntime-cuda-13 feed ships native sm_121a SASS, so it
# runs without any PTX JIT and works on 13.0 drivers. linux-64 keeps the
# earth2studio default: the 1.29.0 aarch64 wheel drops sm_75/80/86 SASS and
# all PTX, and x86 hosts (e.g. A100 = sm_80) still need those. Pinned as a
# direct wheel URL (PyPI hosts the identical CUDA-13 build as of 1.29) because
# a version+index pin conflicts with earth2studio's uv source for the package.
# cp312 matches the python = "3.12.*" pin above.
[feature.base.target.linux-aarch64.pypi-dependencies]
onnxruntime-gpu = { url = "https://files.pythonhosted.org/packages/fa/96/1be0b9711a614861fbf5c0c85c4da3aa2321f9da0b4734a717eb606f70ab/onnxruntime_gpu-1.29.0-cp312-cp312-manylinux_2_34_aarch64.whl" }

# aifs2: AIFS-Single/ENS v2 deterministic (anemoi-models 0.9.3–0.9.5).
[feature.aifs2.pypi-dependencies]
earth2studio = { git = "https://github.com/NVIDIA/earth2studio.git", rev = "1a6e3669db0b04c1b42253cf0e631ed1ee8817ea", extras = ["aifs2", "data"] }
# Season reassembly (forecast_pipeline) runs on dask; base has it from the
# graphcast/gencast extras.
dask = "*"

# aifs2ens: AIFS-ENS v2 (anemoi-models 0.11.2).
# Its graph attention runs as Triton kernels, and Triton builds a small C helper
# against cuda.h the first time it starts: it needs a C compiler and the CUDA
# headers (cuda-cudart-dev), neither of which the pytorch stack brings. The
# Modal image gets both from its NGC base image. The headers are held to the
# CUDA major the env is solved for: unpinned, the linux-64 solve trades the
# whole stack down to CUDA 12 (and a pytorch without triton) to fit them.
[feature.aifs2ens.dependencies]
gcc = "*"
cuda-cudart-dev = "13.*"

[feature.aifs2ens.pypi-dependencies]
earth2studio = { git = "https://github.com/NVIDIA/earth2studio.git", rev = "1a6e3669db0b04c1b42253cf0e631ed1ee8817ea", extras = ["aifs2ens", "data"] }
# Season reassembly (forecast_pipeline) runs on dask; base has it from the
# graphcast/gencast extras.
dask = "*"

[environments]
base = ["base"]
aifs2 = ["aifs2"]
aifs2ens = ["aifs2ens"]
