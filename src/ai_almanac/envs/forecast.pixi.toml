# Pixi spec for the ai-almanac live-forecast execution environment.
#
# Holds earth2studio, its PyTorch/CUDA stack, and the geo stack needed to
# render Cloud-Optimized GeoTIFFs (rasterio/GDAL/PROJ). Separate from the
# benchmark/blending environments since this is by far the heaviest of the
# three — kept out of the default install so `pip install ai-almanac` and
# `ai-almanac env prepare`'s other environments stay light.
#
# Installed into `$AI_ALMANAC_DATA_DIR/forecast-env/` on first use via
# `ai-almanac env prepare`. Real (non-stub) local execution requires a GPU —
# see the `self-host-local-gpu` deployment profile.

[workspace]
name = "ai-almanac-forecast"
description = "Live forecast execution environment for ai-almanac."
channels = ["conda-forge"]
# Linux only: earth2studio's GPU extras (e.g. fuxi's onnxruntime-gpu) ship no
# macOS wheels at all, and forecast_pipeline.load_model() hard-requires CUDA
# regardless — there's no CPU/Mac fallback to support. Real local execution
# needs a Linux GPU host (see the `self-host-local-gpu` deployment profile).
platforms = ["linux-64", "linux-aarch64"]

[dependencies]
python = "3.11.*"
pip = "*"
pytorch = "*"
# Geo stack — conda-forge handles the GDAL/PROJ C libs cleanly.
gdal = "*"
proj = "*"
rasterio = "*"
netcdf4 = "<1.7.3"
h5netcdf = "*"
xarray = "*"
zarr = "*"
numpy = "*"
pyyaml = "*"
# earth2studio 0.14.0 pins pandas<3; without this the conda solver picks
# whatever pandas its other conda deps allow (currently 3.x), which then
# fails pypi resolution against earth2studio's pin.
pandas = "<3"

[pypi-dependencies]
earth2studio = { git = "https://github.com/NVIDIA/earth2studio.git", rev = "0.14.0", extras = ["aifs", "data", "fuxi", "graphcast"] }
