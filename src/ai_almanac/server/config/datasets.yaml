# Demo dataset registry
#
# Each entry defines a named observational dataset available to all users.
# The obs_dir path is read from the env var derived from the id:
#   {ID}_OBS_DIR (uppercased, hyphens → underscores)
#
# Example: id "test-ethiopia" → env var TEST_ETHIOPIA_OBS_DIR
#
# Entries whose env var is unset or empty are excluded at runtime.

- id: test-ethiopia
  name: "Test Ethiopia"
  region: ethiopia
  obs_file_pattern: "{}.nc"

# --- Real benchmark datasets (set the corresponding env vars to enable) ---

- id: ethiopia
  name: "CHIRPS Ethiopia"
  region: ethiopia
  obs_file_pattern: "{}.nc"

- id: imd-2p0
  name: "IMD India (2 deg)"
  region: india
  obs_file_pattern: "data_{}.nc"

# --- Public remote datasets (always included; fetched at job time) ---

- id: era5-ethiopia
  name: "ERA5 Ethiopia"
  provider: era5_arco
  arco_url: "gs://gcp-public-data-arco-era5/ar/full_37-1h-0p25deg-chunk-1.zarr-v3"
  precip_var: total_precipitation
  unit_cvt: 1000.0
  region: ethiopia
  lat_bounds: [3, 15]
  lon_bounds: [33, 48]
  obs_file_pattern: "{}.nc"

- id: era5-india
  name: "ERA5 India"
  provider: era5_arco
  arco_url: "gs://gcp-public-data-arco-era5/ar/full_37-1h-0p25deg-chunk-1.zarr-v3"
  precip_var: total_precipitation
  unit_cvt: 1000.0
  region: india
  lat_bounds: [5, 40]
  lon_bounds: [65, 100]
  obs_file_pattern: "{}.nc"
