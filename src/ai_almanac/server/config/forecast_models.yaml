# Forecast model registry
#
# Each entry defines an AI weather model available for live, on-demand
# forecast generation (as opposed to `models.yaml`, which registers archived
# benchmark/blend model data sources). Internal fields (earth2studio_class,
# gpu, env, ensemble, nensemble) are used by the runners only and are stripped
# before the API returns this list to clients.
#
# `env` names the execution environment that can run the model — the AIFS
# families pin incompatible anemoi-models versions, so they live in separate
# environments (see forecast.pixi.toml and modal/forecasts_app.py). `ensemble:
# true` models are rolled out with earth2studio's ensemble workflow and their
# members kept apart, as in the archives blends train on; `nensemble` is the
# member count. A blend refuses a live ensemble with fewer members than it was
# trained on (and reads only the trained ones of a larger one), so it must be
# at least the archive's: 26 for AIFS-ENS v2.
#
# `training` lists the years and datasets a checkpoint was pretrained and
# fine-tuned on, with the publication they come from. The benchmark assistant
# checks evaluation years against it, so only record published values; leave
# it out when unknown rather than estimating.
#
# `init_sources` lists the initialization data sources (forecast_pipeline's
# INIT_SOURCES) that carry every input a model reads; leave it out when every
# source does. GFS lacks the soil, skin-temperature, total-column-water, snow
# and wave fields the AIFS family and Aurora 1.5 read, and earth2studio would
# zero-fill them, so those start from IFS only. A forecast can only pick a
# listed source for a model.
#
# `earliest_issue_date` is the first date a model's inputs exist for; a season
# with the model in it starts there for every member, since the blend scores
# only the dates all of them have. ECMWF's open data carries the AIFS v2
# models' 10 hPa level and extended wave fields only from its 2026-05-12
# 06 UTC run, and a 00 UTC issue also reads the previous day's 18 UTC run.
#
# `variables`/`default_lead_hours` are shared across all models and are the
# single source of truth for both the API's model list and the runners'
# inference defaults.
#
# A model data source names the entry that produced it by `id` at registration
# (metadata.forecast_model_id), so ids are a stored contract: add entries
# freely, but never rename or remove an id that data sources link to.

variables: ["t2m", "wind10m", "tcwv", "msl", "wind850m", "u850", "v850", "q850", "z500"]
default_lead_hours: [0, 6, 12, 24, 48, 72, 120]

models:
  - id: aifs
    display_name: "AIFS"
    earth2studio_class: "AIFS"
    env: base
    init_sources: [ifs]
    gpu: "A100-80GB"
    resolution_deg: 0.25
    description: "ECMWF Artificial Intelligence Forecasting System (AIFS-Single v1)."
    training:
      source: "https://huggingface.co/ecmwf/aifs-single-1.1"
      periods:
      - {stage: pretraining, dataset: ERA5, start_year: 1979, end_year: 2022}
      - {stage: fine-tuning, dataset: IFS operational analysis, start_year: 2016, end_year: 2022}

  - id: aifsens
    display_name: "AIFS ENS"
    earth2studio_class: "AIFSENS"
    env: base
    init_sources: [ifs]
    ensemble: true
    nensemble: 8
    gpu: "A100-80GB"
    resolution_deg: 0.25
    description: "ECMWF AIFS Ensemble v1 (reported as the ensemble mean)."
    training:
      source: "https://www.ecmwf.int/en/newsletter/185/earth-system-science/aifs-ens-becomes-operational"
      periods:
      - {stage: pretraining, dataset: ERA5, start_year: 1979, end_year: 2017}
      - {stage: fine-tuning, dataset: IFS operational analysis, start_year: 2016, end_year: 2023}

  - id: aifs2
    display_name: "AIFS2"
    earth2studio_class: "AIFS2"
    env: aifs2
    init_sources: [ifs]
    earliest_issue_date: "2026-05-13"
    gpu: "A100-80GB"
    resolution_deg: 0.25
    description: "ECMWF AIFS-Single v2."
    training:
      source: "https://huggingface.co/ecmwf/aifs-single-2.0"
      periods:
      - {stage: pretraining, dataset: ERA5, start_year: 1979, end_year: 2022}
      - {stage: fine-tuning, dataset: IFS operational analysis, start_year: 2018, end_year: 2024}

  - id: aifs2ens
    display_name: "AIFS2 ENS"
    earth2studio_class: "AIFS2ENS"
    env: aifs2ens
    init_sources: [ifs]
    earliest_issue_date: "2026-05-13"
    ensemble: true
    nensemble: 26
    gpu: "A100-80GB"
    resolution_deg: 0.25
    description: "ECMWF AIFS Ensemble v2 (reported as the ensemble mean)."
    training:
      source: "https://huggingface.co/ecmwf/aifs-ens-2.0"
      periods:
      - {stage: pretraining, dataset: ERA5, start_year: 1979, end_year: 2022}
      - {stage: fine-tuning, dataset: IFS operational analysis, start_year: 2018, end_year: 2024}

  - id: graphcast
    display_name: "GraphCast Small"
    earth2studio_class: "GraphCastSmall"
    env: base
    gpu: "A100-80GB"
    resolution_deg: 1.0
    description: "Lower-resolution GraphCast variant."
    training:
      source: "https://github.com/google-deepmind/graphcast/blob/main/docs/weathernext1_graph/README.md"
      periods:
      - {stage: pretraining, dataset: ERA5, start_year: 1979, end_year: 2015}

  - id: graphcast_operational
    display_name: "GraphCast Operational"
    earth2studio_class: "GraphCastOperational"
    env: base
    gpu: "A100-80GB"
    resolution_deg: 0.25
    description: "Operational-resolution GraphCast global forecast model."
    training:
      source: "https://github.com/google-deepmind/graphcast/blob/main/docs/weathernext1_graph/README.md"
      periods:
      - {stage: pretraining, dataset: ERA5, start_year: 1979, end_year: 2017}
      - {stage: fine-tuning, dataset: ECMWF HRES, start_year: 2016, end_year: 2021}

  - id: gencast
    display_name: "GenCast Mini"
    earth2studio_class: "GenCastMini"
    env: base
    gpu: "A100-80GB"
    resolution_deg: 1.0
    description: "Mini stochastic GenCast variant."
    training:
      source: "https://github.com/google-deepmind/graphcast/blob/main/docs/weathernext1_gen/README.md"
      periods:
      - {stage: pretraining, dataset: ERA5, start_year: 1979, end_year: 2018}

  - id: fuxi
    display_name: "FuXi"
    earth2studio_class: "FuXi"
    env: base
    gpu: "A100-80GB"
    resolution_deg: 0.25
    description: "FuXi medium-range global forecast model."
    training:
      source: "https://arxiv.org/abs/2306.12873"
      periods:
      - {stage: pretraining, dataset: ERA5, start_year: 1979, end_year: 2015}

  # Aurora 1.5, not earth2studio's original Aurora: a different checkpoint,
  # class and archive.
  - id: aurora1p5
    display_name: "Aurora 1.5"
    earth2studio_class: "Aurora1p5"
    env: base
    init_sources: [ifs]
    gpu: "A100-80GB"
    resolution_deg: 0.25
    description: "Microsoft Aurora 1.5 at 0.25°, stepped hourly so its hourly precipitation sums to daily totals."
