# Models the managed local LLM (`llm_engine = "managed"`) offers at setup.
#
# Each entry carries the `vllm serve` flags and memory share it needs: tool-call
# and reasoning parsers differ by model family, and a model's weights decide how
# much of the Spark's unified memory vLLM must claim. These apply whenever
# `llm_serve_args` is left blank; a non-blank value replaces `serve_args`
# wholesale. Flags common to every model (loopback host/port, sleep mode, memory
# share, shutdown grace) are added by server/services/local_llm.py.
#
# `verified: true` means someone served the model with the vLLM pinned in
# envs/llm.pixi.toml on a DGX Spark and confirmed sleep/wake and a parsed tool
# call (see docs/local-llm-design.md). Unverified entries carry the flags from
# `source`; verify one before flipping the flag.
#
# `--max-cudagraph-capture-size 32` and `--safetensors-load-strategy eager` are
# the Spark startup/wake tuning from the design doc and are not model-specific.
#
# `--kernel-config.enable_flashinfer_autotune false` is Spark startup tuning too.
# On the GB10 none of FlashInfer's tuned FP8 GEMM tactics run: a cold start spent
# minutes profiling 736 shape/batch pairs, found no usable tactic for any, and
# saved 0 configs, so every call used the default kernel anyway. Skipping the
# search changes no kernel choice and saves those minutes on every cold start.
#
# `speculative_config`, when present, is passed to vLLM as `--speculative-config`
# (unless `llm_serve_args` replaces the flags): a small draft model proposes a
# block of tokens and the target verifies them in one pass, so replies come
# faster with the target's output unchanged. Setup downloads `model` alongside
# the target, `weights_gb` counts both, and local_llm.py reloads the draft's
# weights on every wake, which vLLM's own reload leaves out. The
# `llm_speculative_decoding` setting turns it off; `llm_draft_model` swaps in
# another draft (see docs/local-llm-design.md).

models:
  - id: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4
    label: Nemotron 3.5 Lightning 30B-A3B (NVFP4)
    description: >-
      Fast mixture-of-experts model with reliable tool calls. Leaves room for a
      forecast once it sleeps.
    weights_gb: 21.6
    verified: true
    gpu_memory_utilization: 0.45
    serve_args: >-
      --max-model-len 65536 --enable-auto-tool-choice
      --tool-call-parser qwen3_coder --reasoning-parser nemotron_v3
      --max-cudagraph-capture-size 32 --safetensors-load-strategy eager
      --kernel-config.enable_flashinfer_autotune false
    source: docs/local-llm-design.md

  - id: RedHatAI/Qwen3.6-35B-A3B-NVFP4
    label: Qwen3.6 35B-A3B (NVFP4)
    description: >-
      Mixture-of-experts Qwen with a similar footprint and speed to Nemotron
      Lightning.
    weights_gb: 25.0
    verified: false
    gpu_memory_utilization: 0.45
    serve_args: >-
      --max-model-len 65536 --enable-auto-tool-choice
      --tool-call-parser qwen3_coder --reasoning-parser qwen3
      --max-cudagraph-capture-size 32 --safetensors-load-strategy eager
      --kernel-config.enable_flashinfer_autotune false
    source: https://stevescargall.com/blog/2026/04/vllm-recipe-redhatai/qwen3.6-35b-a3b-nvfp4-on-dgx-spark/

  - id: nvidia/Qwen3.8-27B-NVFP4
    label: Qwen3.8 27B (NVFP4) + DFlash 2
    description: >-
      NVIDIA's recommended single-Spark vLLM recipe, with a DFlash 2 draft model
      proposing tokens for it to check. Dense, so it would reply slower than the
      mixture-of-experts models; the draft makes up much of that.
    # 21.9 GB of target, 3.8 GB of BF16 draft.
    weights_gb: 25.7
    # Verified 2026-10-23 with the draft: tool call, sleep/wake with the draft
    # reload, 2.0-3.7x the target alone (docs/local-llm-design.md).
    verified: true
    gpu_memory_utilization: 0.45
    # InstantTensor reads the checkpoint with pipelined direct I/O: loading
    # took 10.1 s instead of 17.1 s, and a wake (which re-reads the weights,
    # the draft's included) 8.5 s instead of 14.0 s, replies unchanged
    # (2026-10-24). Untested on the other entries.
    serve_args: >-
      --max-model-len 65536 --enable-auto-tool-choice
      --tool-call-parser qwen3_coder --reasoning-parser qwen3
      --max-cudagraph-capture-size 32 --safetensors-load-strategy eager
      --kernel-config.enable_flashinfer_autotune false
      --load-format instanttensor
    # A block-diffusion drafter (vLLM's dflash method; DFlash 2 needs the V2
    # model runner, which vLLM picks for it). Seven draft tokens per step is
    # the block size it was trained for. The target checks every token, so
    # replies are the target's own, though not token-identical to it alone:
    # verifying a block runs other kernels, and near-ties can tip.
    # https://huggingface.co/z-lab/Qwen3.8-27B-DFlash2
    speculative_config:
      method: dflash
      model: z-lab/Qwen3.8-27B-DFlash2
      num_speculative_tokens: 7
    source: https://build.nvidia.com/spark/vllm

  - id: nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4
    label: Nemotron 3 Super 120B-A12B (NVFP4)
    description: >-
      Largest model that fits one Spark. Claims most of its memory while awake
      and replies at roughly a third of Lightning's speed.
    weights_gb: 80.3
    verified: false
    gpu_memory_utilization: 0.8
    serve_args: >-
      --max-model-len 65536 --max-num-seqs 4 --enable-auto-tool-choice
      --tool-call-parser qwen3_coder --reasoning-parser nemotron_v3
      --max-cudagraph-capture-size 32 --safetensors-load-strategy eager
      --kernel-config.enable_flashinfer_autotune false
    source: https://vllm.ai/blog/2026-06-01-vllm-dgx-spark
