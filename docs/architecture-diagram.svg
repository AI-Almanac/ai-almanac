<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">
  <defs>
    <style>
      text { fill:#0f172a; }
      .title { font-size:30px; font-weight:700; }
      .sub { font-size:15px; fill:#64748b; }
      .grouptitle { font-size:12px; font-weight:700; fill:#1a56c4; letter-spacing:.3px; }
      .ct { font-size:15px; font-weight:700; }
      .ct2 { font-size:13px; font-weight:700; }
      .cs { font-size:11px; fill:#475569; }
      .cs2 { font-size:10px; fill:#64748b; }
      .lbl { font-size:10.5px; font-weight:600; fill:#475569; }
      .lgd { font-size:11px; fill:#334155; }
      .badge { font-size:9px; font-weight:700; letter-spacing:.4px; }
      .badge.cpu { fill:#475569; } .badge.gpu { fill:#b45309; }
    </style>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset in="blur" dx="0" dy="2" result="off"/>
      <feComponentTransfer in="off" result="shadow">
        <feFuncA type="linear" slope="0.18"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- transparent background -->


  <!-- legend (bottom right) -->
  <line x1="812" y1="636" x2="842" y2="636" stroke="#64748b" stroke-width="1.8" marker-end="url(#arw)"/>
  <text x="848" y="640" class="lgd">Request / data</text>
  <line x1="968" y1="636" x2="998" y2="636" stroke="#64748b" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arw)"/>
  <text x="1004" y="640" class="lgd">Auth / control</text>
  <rect x="812" y="656" width="12" height="12" rx="2" fill="#1a73e8"/>
  <text x="830" y="666" class="lgd">Google Cloud</text>
  <rect x="944" y="656" width="12" height="12" rx="2" fill="#16a34a"/>
  <text x="962" y="666" class="lgd">Modal</text>
  <rect x="1024" y="656" width="12" height="12" rx="2" fill="#64748b"/>
  <text x="1042" y="666" class="lgd">Client / external</text>

  <!-- ===== group containers ===== -->
  <!-- Cloud Run service (frontend + backend, one image) -->
  <rect x="360" y="196" width="210" height="252" rx="14" fill="#eef4fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="465" y="222" text-anchor="middle" class="grouptitle">Cloud Run · single image</text>
  <!-- Object storage (bucket set) -->
  <rect x="650" y="196" width="246" height="316" rx="14" fill="#f5f9ff" stroke="#dce7fb"/>

  <!-- ===== nodes ===== -->
  <!-- browser -->
  <rect x="44" y="304" width="116" height="96" rx="10" fill="#eef2f7" stroke="#64748b" filter="url(#sh)"/>
  <text x="102" y="348" text-anchor="middle" class="ct">Browser</text>
  <text x="102" y="370" text-anchor="middle" class="cs2">end user · runs SPA</text>

  <!-- load balancer -->
  <rect x="198" y="306" width="132" height="92" rx="10" fill="#eaf1fe" stroke="#4285f4" filter="url(#sh)"/>
  <text x="264" y="344" text-anchor="middle" class="ct2">Load balancer</text>
  <text x="264" y="363" text-anchor="middle" class="cs">HTTPS · host routing</text>

  <!-- frontend subcard -->
  <rect x="376" y="234" width="178" height="88" rx="8" fill="#ffffff" stroke="#b8d0f7" filter="url(#sh)"/>
  <text x="465" y="264" text-anchor="middle" class="ct2">Frontend</text>
  <text x="465" y="284" text-anchor="middle" class="cs">Svelte SPA</text>
  <text x="465" y="302" text-anchor="middle" class="cs2">served same-origin</text>
  <!-- backend subcard -->
  <rect x="376" y="332" width="178" height="94" rx="8" fill="#ffffff" stroke="#b8d0f7" filter="url(#sh)"/>
  <text x="465" y="362" text-anchor="middle" class="ct2">Backend API</text>
  <text x="465" y="382" text-anchor="middle" class="cs">FastAPI · job supervisor</text>
  <text x="465" y="400" text-anchor="middle" class="cs2">Globus token auth</text>

  <!-- Globus (external) -->
  <rect x="190" y="480" width="150" height="96" rx="10" fill="#eef2f7" stroke="#64748b" filter="url(#sh)"/>
  <text x="265" y="514" text-anchor="middle" class="ct2">Globus Auth</text>
  <text x="265" y="534" text-anchor="middle" class="cs">OIDC provider</text>
  <text x="265" y="552" text-anchor="middle" class="cs2">bearer-token validation</text>

  <!-- Cloud SQL cylinder -->
  <g filter="url(#sh)">
    <ellipse cx="465" cy="566" rx="70" ry="9" fill="#eaf1fe" stroke="#4285f4"/>
    <rect x="395" y="486" width="140" height="80" fill="#eaf1fe"/>
    <line x1="395" y1="486" x2="395" y2="566" stroke="#4285f4"/>
    <line x1="535" y1="486" x2="535" y2="566" stroke="#4285f4"/>
    <ellipse cx="465" cy="486" rx="70" ry="9" fill="#eaf1fe" stroke="#4285f4"/>
  </g>
  <text x="465" y="514" text-anchor="middle" class="ct2">PostgreSQL</text>
  <text x="465" y="532" text-anchor="middle" class="cs">Cloud SQL</text>
  <text x="465" y="549" text-anchor="middle" class="cs2">jobs · catalog · audit</text>

  <!-- storage buckets -->
  <g filter="url(#sh)">
    <ellipse cx="773" cy="288" rx="103" ry="8" fill="#eaf1fe" stroke="#4285f4"/>
    <rect x="670" y="230" width="206" height="58" fill="#eaf1fe"/>
    <line x1="670" y1="230" x2="670" y2="288" stroke="#4285f4"/>
    <line x1="876" y1="230" x2="876" y2="288" stroke="#4285f4"/>
    <ellipse cx="773" cy="230" rx="103" ry="8" fill="#eaf1fe" stroke="#4285f4"/>
  </g>
  <text x="773" y="254" text-anchor="middle" class="ct2">Data bucket</text>
  <text x="773" y="272" text-anchor="middle" class="cs2">obs + model forecasts · read</text>
  <g filter="url(#sh)">
    <ellipse cx="773" cy="360" rx="103" ry="8" fill="#eaf1fe" stroke="#4285f4"/>
    <rect x="670" y="310" width="206" height="50" fill="#eaf1fe"/>
    <line x1="670" y1="310" x2="670" y2="360" stroke="#4285f4"/>
    <line x1="876" y1="310" x2="876" y2="360" stroke="#4285f4"/>
    <ellipse cx="773" cy="310" rx="103" ry="8" fill="#eaf1fe" stroke="#4285f4"/>
  </g>
  <text x="773" y="334" text-anchor="middle" class="ct2">Uploads bucket</text>
  <text x="773" y="352" text-anchor="middle" class="cs2">user datasets</text>
  <g filter="url(#sh)">
    <ellipse cx="773" cy="482" rx="103" ry="8" fill="#eaf1fe" stroke="#4285f4"/>
    <rect x="670" y="392" width="206" height="90" fill="#eaf1fe"/>
    <line x1="670" y1="392" x2="670" y2="482" stroke="#4285f4"/>
    <line x1="876" y1="392" x2="876" y2="482" stroke="#4285f4"/>
    <ellipse cx="773" cy="392" rx="103" ry="8" fill="#eaf1fe" stroke="#4285f4"/>
  </g>
  <text x="773" y="424" text-anchor="middle" class="ct2">Outputs bucket</text>
  <text x="773" y="442" text-anchor="middle" class="cs2">metrics · blend artifacts</text>
  <text x="773" y="458" text-anchor="middle" class="cs2">chat figures · run logs</text>

  <!-- Modal jobs -->
  <rect x="922" y="232" width="232" height="204" rx="10" fill="#e8f8ef" stroke="#22a45d" filter="url(#sh)"/>
  <text x="1038" y="262" text-anchor="middle" class="ct">Modal jobs</text>
  <rect x="936" y="278" width="204" height="26" rx="8" fill="#ffffff" stroke="#cbe7d6"/>
  <text x="952" y="295" class="ct2">Benchmarks</text>
  <rect x="1088" y="282" width="44" height="18" rx="9" fill="#eef2f7" stroke="#94a3b8"/>
  <text x="1110" y="295" text-anchor="middle" class="badge cpu">CPU</text>
  <rect x="936" y="310" width="204" height="26" rx="8" fill="#ffffff" stroke="#cbe7d6"/>
  <text x="952" y="327" class="ct2">Model blends</text>
  <rect x="1088" y="314" width="44" height="18" rx="9" fill="#eef2f7" stroke="#94a3b8"/>
  <text x="1110" y="327" text-anchor="middle" class="badge cpu">CPU</text>
  <rect x="936" y="342" width="204" height="26" rx="8" fill="#ffffff" stroke="#cbe7d6"/>
  <text x="952" y="359" class="ct2">Forecasts</text>
  <rect x="1088" y="346" width="44" height="18" rx="9" fill="#fff3e0" stroke="#f59e0b"/>
  <text x="1110" y="359" text-anchor="middle" class="badge gpu">GPU</text>
  <text x="1038" y="392" text-anchor="middle" class="cs2">reads Data · writes Outputs buckets</text>
  <text x="1038" y="410" text-anchor="middle" class="cs2">state reconciled by backend</text>

  <!-- ===== arrows ===== -->
  <line x1="162" y1="352" x2="196" y2="352" stroke="#64748b" stroke-width="1.8" marker-end="url(#arw)"/>

  <line x1="332" y1="352" x2="374" y2="352" stroke="#64748b" stroke-width="1.8" marker-end="url(#arw)"/>

  <line x1="376" y1="392" x2="322" y2="480" stroke="#64748b" stroke-width="1.8" stroke-dasharray="5 4" marker-start="url(#arw)" marker-end="url(#arw)"/>

  <line x1="465" y1="426" x2="465" y2="484" stroke="#64748b" stroke-width="1.8" marker-end="url(#arw)"/>

  <line x1="572" y1="348" x2="648" y2="340" stroke="#64748b" stroke-width="1.8" marker-end="url(#arw)"/>

  <line x1="920" y1="330" x2="898" y2="330" stroke="#64748b" stroke-width="1.8" marker-end="url(#arw)"/>

  <polyline points="465,196 465,150 1038,150 1038,230" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#arw)"/>
</svg>
