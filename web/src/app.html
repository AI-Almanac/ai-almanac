<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!-- Runtime config injected by the ai-almanac backend. When the SPA is
		     served by Vite in dev, this 404s and the build-time `VITE_API_URL`
		     fallback in `lib/api.ts` takes over. -->
		<script src="/config.js"></script>
		%sveltekit.head%
		<!-- Fallback title: only wins when no page emits a `<title>` via
		     `<svelte:head>`, since the first `<title>` in tree order controls
		     `document.title` and this one is intentionally last. -->
		<title>AI Almanac</title>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
